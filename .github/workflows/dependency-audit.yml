name: Auditoria de dependencias
on:
  workflow_dispatch:
  schedule:
    - cron: "15 8 * * 1"
  pull_request:
    paths:
      - "requirements.txt"
      - ".github/workflows/dependency-audit.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar auditor
        run: python -m pip install --upgrade pip pip-audit
      - name: Examinar dependencias instalaveis
        run: python -m pip_audit -r requirements.txt
